name: CardGameApp
options:
  bundleIdPrefix: com.trantuan
  deploymentTarget:
    iOS: "16.0"
targets:
  CardGameApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CardGameEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trantuan.cardgame
        PRODUCT_NAME: CardGameApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: CardGameEngine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
